---
version: 2
before:
  hooks:
    - go mod tidy

builds:
  - main: "./cmd/kubesec-webhook"
    binary: kubesec-webhook
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: arm
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

snapshot:
  name_template: "{{ .Tag }}-next"
